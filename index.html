<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no" />
<title>Holiday Clock -- Themes + Runners (Daily Refresh)</title>
<style>
  :root{
    --bg: #000000;
    --fg: #ffffff;
    --shadow: rgba(0,0,0,0.55);

    /* autoscale variables (overwritten by JS) */
    --size-date: 42px;
    --size-time: 200px;
    --size-count: 40px;
    --size-today: 46px;
  }

  html,body{
    height:100%;
    margin:0;
    background:var(--bg);
    color:var(--fg);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    -webkit-font-smoothing:antialiased;
    -moz-osx-font-smoothing:grayscale;
    transition: background 1.2s ease, color 1.2s ease;
    overflow:hidden;
  }

  #root{
    position:relative;
    width:100%;
    height:100%;
    display:flex;
    align-items:center;
    justify-content:center;
  }

  .layout {
    z-index:2;
    display:flex;
    width:94%;
    height:92%;
    max-width:1200px;
    justify-content:center;
    align-items:center;
  }

  .text-block {
    width:100%;
    text-align:center;
    user-select:none;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    pointer-events:none;
  }

  /* Make countdown and today clickable for testing */
  #countdown, #today {
    pointer-events: auto;
    cursor: pointer;
    transition: opacity 0.2s;
  }

  #countdown:active, #today:active {
    opacity: 0.7;
  }

  #date, #countdown, #today {
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  #date { font-size: var(--size-date); margin:0 0 8px 0; text-shadow:0 2px 10px var(--shadow); }
  #time { font-size: var(--size-time); margin:0; line-height:0.9; font-weight:700; text-shadow:0 6px 16px var(--shadow); white-space:nowrap; }
  #countdown { font-size: var(--size-count); margin-top:10px; text-shadow:0 4px 10px var(--shadow); }
  #today { margin-top:10px; font-size: var(--size-today); font-weight:700; text-shadow:0 6px 14px var(--shadow); }

  /* Runner (character) styles */
  .runner {
    position: absolute;
    bottom: 10%;
    left: -30%;
    height: 70vh;
    width: auto;
    z-index:9999;
    pointer-events:none;
    user-select:none;
    will-change: transform, left;
    filter: drop-shadow(0 6px 8px rgba(0,0,0,0.45));
  }
  
  .runner svg {
    height: 100%;
    width: auto;
  }

  @keyframes runAcross { 
    0% { left: -30%; } 
    100% { left: 130%; } 
  }
  @keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }

  /* small pulse */
  .festive { animation: pulseColor 2.6s ease-in-out infinite; }
  @keyframes pulseColor { 0% { transform: translateY(0); } 50% { transform: translateY(-2px); } 100% { transform: translateY(0); } }

  /* Very small screens safety */
  @media (max-width:360px) {
    #time { letter-spacing:-0.02em; }
  }
</style>
</head>
<body>
  <div id="root" role="main" aria-live="polite">
    <div class="layout">
      <div class="text-block">
        <div id="date"></div>
        <div id="time"></div>
        <div id="countdown"></div>
        <div id="today"></div>
      </div>
    </div>
  </div>

<script>
/* ===============================
   CONFIG
   =============================== */
const REF_W = 480, REF_H = 320;
const BASE = { date:40, time:200, count:38, today:44 };

const PRE_WINDOW_MS = 14 * 24 * 60 * 60 * 1000; // 2 weeks

/* Holidays config - with special theme windows for Christmas and New Year's */
const HOLIDAYS = [
  { key:"newyears", name:"New Year's", m:1, d:1, themeStart: "12-26" },
  { key:"valentine", name:"Valentine's Day", m:2, d:14 },
  { key:"stpatricks", name:"St. Patrick's Day", m:3, d:17 },
  { key:"easter", name:"Easter", m:null, d:"easter" },
  { key:"memorial", name:"Memorial Day", m:5, d:"lastMonday" },
  { key:"independence", name:"4th of July", m:7, d:4 },
  { key:"labor", name:"Labor Day", m:9, d:"firstMonday" },
  { key:"halloween", name:"Halloween", m:10, d:31 },
  { key:"thanksgiving", name:"Thanksgiving", m:11, d:"fourthThursday" },
  { key:"christmas", name:"Christmas", m:12, d:25, themeStart: "12-01" }
];

const COLOR_CYCLE_MS = 3000;
const RUNNER_MIN_MS = 15000;
const RUNNER_MAX_MS = 90000;
const RUN_DURATION_BASE_SEC = 6;

/* Theme palettes - IMPROVED for cheap TFT screens with higher saturation */
const THEME = {
  newyears:    { backgrounds:["#1A0033","#330066","#00111a"], texts:["#FFD700","#E8D6FF","#FFFFFF"] },
  valentine:   { backgrounds:["#E63963","#FF8AAE","#FFC2D4"], texts:["#FFFFFF","#FFE6EE","#FFF5FA"] },
  stpatricks:  { backgrounds:["#0B6E27","#1FA040","#3BD25B"], texts:["#FFFFFF","#E3FFD8","#F1FFEB"] },
  easter:      { backgrounds:["#FFD6E8","#D9D4FF","#D1F7FF"], texts:["#6A3F99","#8F538D","#725679"] },
  memorial:    { backgrounds:["#1F3A93","#3A62C9","#6A89CC"], texts:["#FFFFFF","#DCEBFF","#EAF4FF"] },
  independence:{ backgrounds:["#0A1A59","#8B0000","#001133"], texts:["#FFFFFF","#FFCCCC","#DDE7FF"] },
  labor:       { backgrounds:["#332E2E","#5A4B3A","#8A6E4C"], texts:["#FFFFFF","#FFEFD7","#FFF3E6"] },
  halloween:   { backgrounds:["#FF7A00","#CC5500","#FFA531"], texts:["#1A1A1A","#332222","#2A1200"] },
  thanksgiving:{ backgrounds:["#D2691E","#FF8C00"], texts:["#FFFF00","#FFFFFF"] },
  christmas:   { backgrounds:["#8B0000","#0F4D1A","#004C3F"], texts:["#FFFFFF","#FFE8A3","#FFFAF2"] }
};

/* ===============================
   Utilities: dates and movable holidays
   =============================== */

function easterDate(year){
  const a = year % 19;
  const b = Math.floor(year/100);
  const c = year % 100;
  const d = Math.floor(b/4);
  const e = b % 4;
  const f = Math.floor((b+8)/25);
  const g = Math.floor((b-f+1)/3);
  const h = (19*a + b - d - g + 15) % 30;
  const i = Math.floor(c/4);
  const k = c % 4;
  const l = (32 + 2*e + 2*i - h - k) % 7;
  const m = Math.floor((a + 11*h + 22*l) / 451);
  const month = Math.floor((h + l - 7*m + 114)/31);
  const day = ((h + l - 7*m + 114) % 31) + 1;
  return new Date(year, month-1, day);
}

function nthWeekdayOfMonth(year, monthIndex, weekday, n) {
  const first = new Date(year, monthIndex, 1);
  const firstWeekday = first.getDay();
  let day = 1 + ((7 + weekday - firstWeekday) % 7) + (n-1)*7;
  return new Date(year, monthIndex, day);
}

function lastWeekdayOfMonth(year, monthIndex, weekday) {
  const last = new Date(year, monthIndex+1, 0);
  const lastWeekday = last.getDay();
  let day = last.getDate() - ((7 + lastWeekday - weekday) % 7);
  return new Date(year, monthIndex, day);
}

function holidayDate(h, year) {
  if(h.d === "easter") return easterDate(year);
  if(h.d === "fourthThursday") return nthWeekdayOfMonth(year, 10, 4, 4);
  if(h.d === "firstMonday") return nthWeekdayOfMonth(year, 8, 1, 1);
  if(h.d === "lastMonday") return lastWeekdayOfMonth(year, 4, 1);
  if(typeof h.d === "number") return new Date(year, h.m-1, h.d);
  return null;
}

function getActiveHoliday(){
  const now = Date.now();
  const currentDate = new Date(now);
  const y = currentDate.getFullYear();
  
  for(const h of HOLIDAYS){
    let dt = holidayDate(h, y);
    if(!dt) continue;
    
    if(dt.getTime() + (24*60*60*1000) < now) dt = holidayDate(h, y+1);
    
    let themeStartTime;
    if(h.themeStart){
      const [month, day] = h.themeStart.split('-').map(Number);
      const themeYear = (month > dt.getMonth() + 1) ? dt.getFullYear() - 1 : dt.getFullYear();
      themeStartTime = new Date(themeYear, month - 1, day).getTime();
    } else {
      themeStartTime = dt.getTime() - PRE_WINDOW_MS;
    }
    
    const end = dt.getTime() + (24*60*60*1000);
    if(now >= themeStartTime && now <= end) {
      return { active:true, key:h.key, name:h.name, date:dt };
    }
  }
  return { active:false };
}

function getNextHoliday(){
  const now = Date.now();
  const y = (new Date()).getFullYear();
  let closest = null;
  let closestDiff = Infinity;
  
  for(const h of HOLIDAYS){
    let dt = holidayDate(h, y);
    if(!dt) continue;
    
    if(dt.getTime() < now) dt = holidayDate(h, y+1);
    
    const diff = dt.getTime() - now;
    if(diff > 0 && diff < closestDiff){
      closestDiff = diff;
      closest = { key:h.key, name:h.name, date:dt };
    }
  }
  
  return closest;
}

function applyScale(){
  const w = window.innerWidth || document.documentElement.clientWidth;
  const h = window.innerHeight || document.documentElement.clientHeight;
  let s = Math.min(w/REF_W, h/REF_H);
  s = Math.max(s, 0.55);
  s = Math.min(s, 3.0);
  document.documentElement.style.setProperty('--size-date', Math.round(BASE.date * s) + 'px');
  document.documentElement.style.setProperty('--size-time', Math.round(BASE.time * s) + 'px');
  document.documentElement.style.setProperty('--size-count', Math.round(BASE.count * s) + 'px');
  document.documentElement.style.setProperty('--size-today', Math.round(BASE.today * s) + 'px');
}

let colorIndex = 0;
let colorTimer = null;

function applyThemeColors(key){
  if(!key || !THEME[key]) {
    document.documentElement.style.setProperty('--bg','#000000');
    document.documentElement.style.setProperty('--fg','#FFFFFF');
    return;
  }
  const pal = THEME[key];
  const i = colorIndex % pal.backgrounds.length;
  document.documentElement.style.setProperty('--bg', pal.backgrounds[i]);
  document.documentElement.style.setProperty('--fg', pal.texts[i]);
  colorIndex++;
}

function startColorCycle(key){
  if(colorTimer) { clearInterval(colorTimer); colorTimer = null; }
  if(!key) { applyThemeColors(null); return; }
  colorIndex = 0;
  applyThemeColors(key);
  colorTimer = setInterval(()=> applyThemeColors(key), COLOR_CYCLE_MS);
}

const elDate = document.getElementById('date');
const elTime = document.getElementById('time');
const elCount = document.getElementById('countdown');
const elToday = document.getElementById('today');

elCount.addEventListener('click', () => {
  const active = getActiveHoliday();
  if(active.active) spawnRunner(active.key, true);
});

elToday.addEventListener('click', () => {
  const active = getActiveHoliday();
  if(active.active) spawnRunner(active.key, true);
});

function updateClockAndCountdown(){
  const now = new Date();
  elDate.textContent = now.toLocaleDateString(undefined, { weekday:"long", month:"long", day:"numeric" });
  const raw = now.toLocaleTimeString([], { hour:"numeric", minute:"2-digit" });
  elTime.textContent = raw.replace(/ ?[AP]M?/i, "");

  // Get active theme holiday
  const active = getActiveHoliday();
  
  // Get next holiday for countdown (always show, even if months away)
  const next = getNextHoliday();
  
  if(next){
    const todayMidnight = new Date(now.getFullYear(), now.getMonth(), now.getDate());
    const holidayMidnight = new Date(next.date.getFullYear(), next.date.getMonth(), next.date.getDate());
    const days = Math.round((holidayMidnight.getTime() - todayMidnight.getTime()) / (1000*60*60*24));
    
    if(days === 0){
      // Today is the holiday!
      let greeting = "Happy " + next.name + "!";
      if(next.key === "christmas") greeting = "Merry Christmas!";
      elToday.textContent = greeting;
      elCount.textContent = "";
    } else {
      elToday.textContent = "";
      elCount.textContent = `${days} day${days !== 1 ? 's' : ''} until ${next.name}`;
    }
  } else {
    elToday.textContent = "";
    elCount.textContent = "";
  }
}

  svg.innerHTML = `
    <g class="firework">
      <!-- Center burst -->
      <circle cx="50" cy="50" r="8" fill="#FFD700">
        <animate attributeName="r" values="8;12;8" dur="0.5s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="1;0.7;1" dur="0.5s" repeatCount="indefinite"/>
      </circle>
      
      <!-- Sparkles radiating out -->
      <g class="sparks">
        <!-- Top sparks -->
        <circle cx="50" cy="20" r="3" fill="#FF4500">
          <animate attributeName="cy" values="20;15;20" dur="0.6s" repeatCount="indefinite"/>
        </circle>
        <circle cx="50" cy="25" r="2" fill="#FFD700">
          <animate attributeName="cy" values="25;20;25" dur="0.5s" repeatCount="indefinite"/>
        </circle>
        
        <!-- Top-right sparks -->
        <circle cx="65" cy="30" r="3" fill="#00FF00">
          <animate attributeName="cx" values="65;70;65" dur="0.6s" repeatCount="indefinite"/>
          <animate attributeName="cy" values="30;25;30" dur="0.6s" repeatCount="indefinite"/>
        </circle>
        <circle cx="60" cy="35" r="2" fill="#FF1493">
          <animate attributeName="cx" values="60;63;60" dur="0.5s" repeatCount="indefinite"/>
        </circle>
        
        <!-- Right sparks -->
        <circle cx="75" cy="50" r="3" fill="#00BFFF">
          <animate attributeName="cx" values="75;80;75" dur="0.6s" repeatCount="indefinite"/>
        </circle>
        <circle cx="70" cy="50" r="2" fill="#FF4500">
          <animate attributeName="cx" values="70;73;70" dur="0.5s" repeatCount="indefinite"/>
        </circle>
        
        <!-- Bottom-right sparks -->
        <circle cx="65" cy="70" r="3" fill="#FFD700">
          <animate attributeName="cx" values="65;70;65" dur="0.6s" repeatCount="indefinite"/>
          <animate attributeName="cy" values="70;75;70" dur="0.6s" repeatCount="indefinite"/>
        </circle>
        <circle cx="60" cy="65" r="2" fill="#00FF00">
          <animate attributeName="cy" values="65;68;65" dur="0.5s" repeatCount="indefinite"/>
        </circle>
        
        <!-- Bottom sparks -->
        <circle cx="50" cy="80" r="3" fill="#FF1493">
          <animate attributeName="cy" values="80;85;80" dur="0.6s" repeatCount="indefinite"/>
        </circle>
        <circle cx="50" cy="75" r="2" fill="#00BFFF">
          <animate attributeName="cy" values="75;78;75" dur="0.5s" repeatCount="indefinite"/>
        </circle>
        
        <!-- Bottom-left sparks -->
        <circle cx="35" cy="70" r="3" fill="#FF4500">
          <animate attributeName="cx" values="35;30;35" dur="0.6s" repeatCount="indefinite"/>
          <animate attributeName="cy" values="70;75;70" dur="0.6s" repeatCount="indefinite"/>
        </circle>
        <circle cx="40" cy="65" r="2" fill="#FFD700">
          <animate attributeName="cy" values="65;68;65" dur="0.5s" repeatCount="indefinite"/>
        </circle>
        
        <!-- Left sparks -->
        <circle cx="25" cy="50" r="3" fill="#00FF00">
          <animate attributeName="cx" values="25;20;25" dur="0.6s" repeatCount="indefinite"/>
        </circle>
        <circle cx="30" cy="50" r="2" fill="#FF1493">
          <animate attributeName="cx" values="30;27;30" dur="0.5s" repeatCount="indefinite"/>
        </circle>
        
        <!-- Top-left sparks -->
        <circle cx="35" cy="30" r="3" fill="#00BFFF">
          <animate attributeName="cx" values="35;30;35" dur="0.6s" repeatCount="indefinite"/>
          <animate attributeName="cy" values="30;25;30" dur="0.6s" repeatCount="indefinite"/>
        </circle>
        <circle cx="40" cy="35" r="2" fill="#FF4500">
          <animate attributeName="cx" values="40;37;40" dur="0.5s" repeatCount="indefinite"/>
        </circle>
      </g>
      
      <!-- Trailing sparkle effects -->
      <circle cx="45" cy="45" r="2" fill="#FFF" opacity="0.8">
        <animate attributeName="opacity" values="0.8;0.3;0.8" dur="0.4s" repeatCount="indefinite"/>
      </circle>
      <circle cx="55" cy="45" r="2" fill="#FFF" opacity="0.8">
        <animate attributeName="opacity" values="0.3;0.8;0.3" dur="0.4s" repeatCount="indefinite"/>
      </circle>
      <circle cx="45" cy="55" r="2" fill="#FFF" opacity="0.8">
        <animate attributeName="opacity" values="0.8;0.3;0.8" dur="0.4s" repeatCount="indefinite"/>
      </circle>
      <circle cx="55" cy="55" r="2" fill="#FFF" opacity="0.8">
        <animate attributeName="opacity" values="0.3;0.8;0.3" dur="0.4s" repeatCount="indefinite"/>
      </circle>
    </g>
  `;
  return svg;
}


function createLeprechaunSVG() {
  const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
  svg.setAttribute("viewBox", "0 0 100 100");
  svg.setAttribute("width", "100%");
  svg.setAttribute("height", "100%");
  svg.innerHTML = `
    <g class="leprechaun">
      <rect x="38" y="30" width="24" height="8" fill="#228B22"/>
      <path d="M 35 38 L 40 25 L 60 25 L 65 38 Z" fill="#228B22"/>
      <rect x="38" y="37" width="24" height="3" fill="#000"/>
      <rect x="46" y="35" width="8" height="4" fill="#FFD700"/>
      <circle cx="50" cy="50" r="14" fill="#FFE4C4"/>
      <path d="M 38 50 Q 42 62 50 60 Q 58 62 62 50" fill="#FF6347"/>
      <circle cx="44" cy="48" r="2" fill="#000"/>
      <circle cx="56" cy="48" r="2" fill="#000"/>
      <rect x="40" y="62" width="20" height="24" fill="#228B22" rx="3"/>
      <rect x="38" y="72" width="24" height="4" fill="#000"/>
      <rect x="48" y="70" width="4" height="8" fill="#FFD700"/>
      <rect x="42" y="85" width="6" height="10" fill="#000"/>
      <rect x="52" y="85" width="6" height="10" fill="#000"/>
    </g>
  `;
  return svg;
}

const CHARACTER_CREATORS = {
  turkey: createTurkeySVG,
  santa: createSantaSVG,
  pumpkin: createPumpkinSVG,
  bunny: createBunnySVG,
  cupid: createCupidSVG,
  firework: createFireworkSVG,
  leprechaun: createLeprechaunSVG
};

let runnerTimeout = null;
let prevActiveKey = null;

const RUNNERS_BY_HOLIDAY = {
  thanksgiving: ["turkey"],
  christmas: ["santa"],
  newyears: ["firework"],
  valentine: ["cupid"],
  stpatricks: ["leprechaun"],
  easter: ["bunny"],
  halloween: ["pumpkin"],
  independence: ["firework"],
  labor: ["turkey"],
  memorial: ["firework"]
};

function randomBetween(min, max) { return Math.floor(Math.random()*(max-min))+min; }

function pickRunnerForHoliday(key){
  const arr = RUNNERS_BY_HOLIDAY[key] || [];
  if(arr.length === 0) return "turkey";
  return arr[Math.floor(Math.random()*arr.length)];
}

async function spawnRunner(holidayKey, forceSpawn = false){
  if(!holidayKey) return;
  if(!forceSpawn && Math.random() < 0.45) return scheduleNextRunner();

  const runnerKey = pickRunnerForHoliday(holidayKey);
  const creator = CHARACTER_CREATORS[runnerKey];
  if(!creator) return scheduleNextRunner();

  const el = document.createElement('div');
  el.className = 'runner';
  const vw = Math.max(document.documentElement.clientWidth, window.innerWidth || 480);
  const duration = Math.max(4, Math.round(RUN_DURATION_BASE_SEC * (vw / 480)));

  const svg = creator();
  el.appendChild(svg);

  document.body.appendChild(el);
  el.style.animation = `runAcross ${duration}s linear, bob 0.6s ease-in-out infinite`;
  
  el.addEventListener('animationend', ()=> el.remove());

  if(!forceSpawn) scheduleNextRunner();
}

function scheduleNextRunner(){
  if(runnerTimeout) clearTimeout(runnerTimeout);
  const active = getActiveHoliday();
  if(!active.active){ runnerTimeout = null; return; }
  const ms = randomBetween(RUNNER_MIN_MS, RUNNER_MAX_MS);
  runnerTimeout = setTimeout(()=> spawnRunner(active.key), ms);
}

function scheduleDailyReloadAt(hour = 0, minute = 5) {
  const now = new Date();
  const next = new Date(now.getFullYear(), now.getMonth(), now.getDate() + 1, hour, minute, 0, 0);
  const ms = next.getTime() - now.getTime();
  setTimeout(() => {
    try { location.reload(); } catch(e){ /* ignore */ }
    scheduleDailyReloadAt(hour, minute);
  }, ms + 200);
}

function scheduleHourlyReload() {
  setInterval(() => {
    try { location.reload(); } catch(e){ /* ignore */ }
  }, 60*60*1000);
}

applyScale();
updateClockAndCountdown();

(function init(){
  const active = getActiveHoliday();
  if(active.active){
    colorIndex = 0;
    startColorCycle(active.key);
    scheduleNextRunner();
  } else {
    startColorCycle(null);
  }

  setInterval(() => {
    updateClockAndCountdown();

    const activeNow = getActiveHoliday();
    if(activeNow.active){
      if(prevActiveKey !== activeNow.key){
        prevActiveKey = activeNow.key;
        colorIndex = 0;
        startColorCycle(activeNow.key);
        scheduleNextRunner();
      }
    } else {
      if(prevActiveKey !== null){
        prevActiveKey = null;
        startColorCycle(null);
        if(runnerTimeout) { clearTimeout(runnerTimeout); runnerTimeout = null; }
      }
    }
  }, 3000);

  setInterval(() => updateClockAndCountdown(), 1000);

  window.addEventListener('resize', () => setTimeout(applyScale, 80));
  window.addEventListener('orientationchange', () => setTimeout(applyScale, 200));
  setTimeout(applyScale, 300);

  scheduleDailyReloadAt(0,5);
  scheduleHourlyReload();
})();

window.__holidayClock = {
  getActiveHoliday,
  getNextHoliday,
  spawnRunnerNow: () => { const a = getActiveHoliday(); if(a.active) spawnRunner(a.key); },
  applyScale
};
</script>
